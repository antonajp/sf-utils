# Attachment to ContentDocument Migration Configuration
#
# This file defines tiered batch processing for migrating Salesforce Attachments
# to ContentDocuments (Files). Tiers are based on Attachment.BodyLength to optimize
# throughput while avoiding governor limits and heap size errors.
#
# Tier matching: First tier where min_size <= BodyLength < max_size wins.
# Use max_size=-1 to indicate no upper bound.

# Poll interval for checking batch job status (seconds)
poll_interval_seconds=10

# Default start date for querying attachments (ISO 8601 format)
# Only attachments with CreatedDate >= this value will be processed
default_start_date=2020-01-01T00:00:00Z

# =============================================================================
# Tier 1: Small attachments (< 1 MB)
# High throughput with batch processing
# =============================================================================
tier1.min_size=0
tier1.max_size=1048576
tier1.batch_size=10
tier1.batch_class=AttachmentToFilesConversionBatch

# =============================================================================
# Tier 2: Medium attachments (1-3 MB)
# Reduced batch size to manage heap usage
# =============================================================================
tier2.min_size=1048576
tier2.max_size=3145728
tier2.batch_size=3
tier2.batch_class=AttachmentToFilesConversionBatch

# =============================================================================
# Tier 3: Large attachments (3-6 MB)
# Single record per batch to avoid heap limits
# =============================================================================
tier3.min_size=3145728
tier3.max_size=6291456
tier3.batch_size=1
tier3.batch_class=AttachmentToFilesConversionBatch

# =============================================================================
# Tier 4: Extra-large attachments (>= 6 MB)
# Single-record processing with specialized batch class
# =============================================================================
tier4.min_size=6291456
tier4.max_size=-1
tier4.batch_size=1
tier4.batch_class=SingleAttachmentToFilesConversionBatch
